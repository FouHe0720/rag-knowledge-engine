name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: ruff check . && ruff format --check .
      - run: pytest -q --cov=rag_engine --cov-report=term-missing
      - run: python eval/run.py --validate-only
      - run: python eval/run.py --output /tmp/rag-evaluation
      - uses: actions/upload-artifact@v4
        with:
          name: offline-evaluation-py${{ matrix.python }}
          path: /tmp/rag-evaluation
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/docker_smoke.py
